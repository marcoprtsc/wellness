<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#006937">
<title>Venezia FC — Wellness</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<style>
  :root {
    --verde: #006937; --verde-scuro: #00552d; --arancio: #FF6B00;
    --nero: #111; --grigio: #f4f4f1; --bordo: #e3e3df;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--grigio); color: var(--nero); padding-bottom: 46px;
  }
  header {
    background: linear-gradient(160deg, var(--verde) 0%, var(--verde-scuro) 100%);
    color: #fff; text-align: center; position: relative;
    padding: 12px 16px calc(16px + env(safe-area-inset-top)) 16px;
    border-radius: 0 0 22px 22px;
  }
  header img { height: 50px; }
  header h1 { font-size: .95rem; font-weight: 600; letter-spacing: 1px; margin-top: 4px; }
  #saluto { font-size: 1.25rem; font-weight: 700; margin-top: 8px; }
  #dataoggi { font-size: .8rem; opacity: .85; margin-top: 2px; }
  #lingue { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; }
  #lingue button {
    border: 1px solid rgba(255,255,255,.5); background: transparent; color: #fff;
    font-size: .68rem; font-weight: 700; padding: 4px 6px; border-radius: 8px; cursor: pointer;
    opacity: .65;
  }
  #lingue button.sel { background: #fff; color: var(--verde); opacity: 1; }
  main { max-width: 480px; margin: 0 auto; padding: 14px; }
  .card {
    background: #fff; border-radius: 16px; padding: 16px;
    margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.07);
  }
  .card.ok-bordo { outline: 2px solid #bfe3cd; }
  .q { font-weight: 700; font-size: 1rem; margin-bottom: 12px; }
  .scala { display: flex; gap: 7px; }
  .scala button {
    flex: 1; padding: 10px 0; border: 1.5px solid var(--bordo);
    border-radius: 14px; background: #fff; cursor: pointer;
    display: flex; flex-direction: column; align-items: center;
    transition: transform .08s;
  }
  .scala button:active { transform: scale(.93); }
  /* niente numero sotto la faccina: confondeva (1 scambiato per "il migliore") */
  .scala .faccia { font-size: 1.55rem; line-height: 1.2;
    filter: grayscale(1) opacity(.55); }
  .scala button.sel { background: #eaf6ef; border-color: var(--verde); }
  .scala button.sel .faccia { filter: none; }
  .estremi { display: flex; justify-content: space-between; font-size: .7rem; color: #999; margin-top: 7px; }
  /* VAS dolore 0-10: grigia finche' non la tocca, cosi' lo 0 non e' una risposta per sbaglio */
  #vas-val { text-align: center; font-size: 2rem; font-weight: 800; color: #ccc;
             line-height: 1.1; margin-bottom: 6px; }
  #vas-val.dato { color: var(--arancio); }
  #vas-val .tocca { display: block; font-size: .72rem; font-weight: 600; color: #aaa; }
  #vas-r { width: 100%; margin: 0; accent-color: #ccc; }
  #vas-r.dato { accent-color: var(--arancio); }
  .due { display: flex; gap: 10px; }
  .due > div { flex: 1; }
  label.mini { font-size: .78rem; color: #666; display: block; margin-bottom: 5px; font-weight: 600; }
  .ora { display: flex; align-items: stretch; gap: 5px; }
  .ora input[type=time] {
    flex: 1; min-width: 0; padding: 10px 4px; font-size: 1.05rem; text-align: center;
    border: 1.5px solid var(--bordo); border-radius: 12px; background: #fff;
  }
  .ora button {
    width: 40px; border: 1.5px solid var(--bordo); border-radius: 12px;
    background: #fff; font-size: 1rem; font-weight: 800; color: var(--verde); cursor: pointer;
  }
  .ora button:active { background: #eaf6ef; }
  #durata { text-align: center; margin-top: 10px; font-size: .85rem;
            font-weight: 700; color: var(--verde); }
  #durata.strana { color: #b3261e; }
  input[type=text] {
    width: 100%; padding: 12px 10px; font-size: 1.05rem;
    border: 1.5px solid var(--bordo); border-radius: 12px; background: #fff;
  }
  .sino { display: flex; gap: 8px; }
  .sino button {
    flex: 1; padding: 14px 0; font-weight: 700; font-size: 1rem;
    border: 1.5px solid var(--bordo); border-radius: 14px; background: #fff; cursor: pointer;
  }
  .sino button.sel-no { background: #eaf6ef; border-color: var(--verde); color: var(--verde); }
  .sino button.sel-si { background: #fff1e6; border-color: var(--arancio); color: var(--arancio); }
  #barra {
    position: sticky; top: 0; z-index: 5; background: var(--grigio);
    padding: 8px 2px; font-size: .78rem; color: #777; font-weight: 600;
  }
  #barra .traccia { height: 6px; background: #e2e2de; border-radius: 3px; margin-top: 4px; overflow: hidden; }
  #barra .pieno { height: 100%; width: 0%; background: var(--arancio); border-radius: 3px; transition: width .25s; }
  #invia {
    width: 100%; padding: 17px; font-size: 1.15rem; font-weight: 800; letter-spacing: .5px;
    background: var(--arancio); color: #fff; border: 0; border-radius: 16px; cursor: pointer;
    box-shadow: 0 3px 10px rgba(255,107,0,.35);
  }
  #invia:disabled { opacity: .55; box-shadow: none; }
  .msg { text-align: center; padding: 12px; border-radius: 12px; margin-top: 10px; font-weight: 600; display: none; }
  .msg.ok  { background: #e3f2e8; color: var(--verde); display: block; }
  .msg.err { background: #fde8e8; color: #b3261e; display: block; }
  .schermo { text-align: center; padding: 46px 24px; display: none; }
  .schermo .big { font-size: 4rem; }
  .schermo h2 { margin: 12px 0 8px 0; }
  .schermo p { color: #666; font-size: .92rem; line-height: 1.45; }
  .schermo button {
    margin-top: 20px; padding: 12px 26px; border: 1.5px solid var(--verde);
    background: #fff; color: var(--verde); border-radius: 12px; font-weight: 700; cursor: pointer;
  }
</style>
</head>

<header>
  <div id="lingue"></div>
  <img src="icon-192.png" alt="Venezia FC">
  <h1>DAILY WELLNESS</h1>
  <div id="saluto"></div>
  <div id="dataoggi"></div>
</header>

  <div id="no-token" class="schermo card">
    <div class="big">&#128273;</div>

    <p data-t="nt_p"></p>
    <p id="nt-why" style="margin-top:10px;font-size:.75rem;color:#aaa"></p>

  <div id="attesa" class="schermo card">

      <div class="estremi"><span data-t="sonno_lo"></span><span data-t="sonno_hi"></span></div>

    <div class="card ok-bordo" id="card-orari">

        </div>
        <div>

          </div>
        </div>
      </div>
      <div id="durata"></div>
    </div>

    <div class="card" data-k="energia">
      <div class="q">&#9889; <span data-t="q_energia"></span></div>
      <div class="scala"></div>
      <div class="estremi"><span data-t="energia_lo"></span><span data-t="energia_hi"></span></div>
    </div>

    <div class="card" data-k="fatica">
      <div class="q">&#127939; <span data-t="q_fatica"></span></div>
      <div class="scala"></div>
      <div class="estremi"><span data-t="fatica_lo"></span><span data-t="fatica_hi"></span></div>
    </div>

    <div class="card" data-k="doms">
      <div class="q">&#128170; <span data-t="q_doms"></span></div>
      <div class="scala"></div>
      <div class="estremi"><span data-t="doms_lo"></span><span data-t="doms_hi"></span></div>
    </div>

    <div class="card" data-k="stress">
      <div class="q">&#127744; <span data-t="q_stress"></span></div>
      <div class="scala"></div>
      <div class="estremi"><span data-t="stress_lo"></span><span data-t="stress_hi"></span></div>
    </div>

    <div class="card" data-k="umore">
      <div class="q">&#127773; <span data-t="q_umore"></span></div>
      <div class="scala"></div>
      <div class="estremi"><span data-t="umore_lo"></span><span data-t="umore_hi"></span></div>
    </div>

    <!-- Dolore: domanda a se', staccata dalla richiesta di valutazione.
         Chi ha un fastidio lo segnala anche se non vuole il fisio: nel report
         finisce in "Zone segnalate senza richiesta di valutazione". -->
    <div class="card">
      <div class="q">&#129657; <span data-t="q_dolore"></span></div>
      <div class="sino">
        <button id="d-no" type="button" data-t="no"></button>
        <button id="d-si" type="button" data-t="si"></button>
      </div>
      <div id="zona-box" style="display:none;margin-top:12px">
        <label class="mini" data-t="zona"></label>
        <input type="text" id="t-zona">
      </div>
    </div>

    <!-- Scala del dolore: compare con la zona (prima dove, poi quanto).
         Resta sempre visibile per chi ha l'interruttore acceso nella colonna
         "vas" della scheda Giocatori. -->
    <div class="card" id="card-vas" style="display:none">
      <div class="q">&#128200; <span data-t="q_vas"></span></div>
      <div id="vas-val">&mdash;</div>
      <input type="range" id="vas-r" min="0" max="10" step="1" value="0">
      <div class="estremi"><span data-t="vas_lo"></span><span data-t="vas_hi"></span></div>
    </div>

    <div class="card">
      <div class="q">&#129658; <span data-t="q_medico"></span></div>
      <div class="sino">
        <button id="f-no" type="button" data-t="no"></button>
        <button id="f-si" type="button" data-t="si"></button>
      </div>
    </div>

    <button id="invia"></button>
    <div id="f-msg" class="msg"></div>
  </div>

  <div id="fatto" class="schermo card">
    <div class="big" style="color:var(--verde)">&#9989;</div>
    <h2 data-t="ok_h"></h2>
    <p data-t="ok_p"></p>
    <p id="fatto-ora" style="margin-top:8px;font-size:.78rem;color:#aaa"></p>
    <button id="rifai" data-t="modifica"></button>
  </div>

</main>

  $("invia").textContent = T("invia");
  disegnaVas();
  const nome = localStorage.getItem("wf_nome");
  if (nome) $("saluto").textContent = T("ciao") + " " + nome + " \u{1F44B}";
  $("dataoggi").textContent = new Date().toLocaleDateString(
    { it: "it-IT", en: "en-GB", fr: "fr-FR", de: "de-DE", es: "es-ES" }[lang],
    { weekday: "long", day: "numeric", month: "long" });
  durata(); progresso();
}

/* ---- viste ---- */
function mostra(v) {
  ["no-token", "attesa", "form", "fatto"].forEach(x =>
    $(x).style.display = x === v ? "block" : "none");
}

/* ---- webhook (JSON + CORS) ---- */
function chiama(params, onOk, onErr, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs || 20000);
  fetch(WEBHOOK_URL + "?" + params.toString(), { signal: ctrl.signal })
    .then(r => { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
    .then(r => { clearTimeout(timer); onOk(r); })
    .catch(e => { clearTimeout(timer);
      const m = String(e && e.message || e);
      onErr(e && e.name === "AbortError" ? "timeout" :
            m.startsWith("http") ? m : String(e)); });
}

/* ---- identita' dal token ---- */
function avvia() {
  const urlId = new URLSearchParams(location.search).get("id");
  if (urlId) localStorage.setItem("wf_id", urlId);
  ID = localStorage.getItem("wf_id");
  if (!ID) { $("nt-why").textContent = "[nessun id nel link]"; mostra("no-token"); return; }

  const nomeCache = localStorage.getItem("wf_nome");
  // VAS: subito com'era ieri, poi la risposta del server decide davvero
  accendiVas(localStorage.getItem("wf_vas") === "1");
  if (nomeCache) pronto(nomeCache); else mostra("attesa");

  chiama(new URLSearchParams({ token: WEBHOOK_TOKEN, a: "chi", id: ID }),
    r => {
      if (r && r.ok) {
        localStorage.setItem("wf_nome", r.cognome);
        localStorage.setItem("wf_vas", r.vas ? "1" : "0");
        accendiVas(r.vas);
        if (!nomeCache) pronto(r.cognome);
        else $("saluto").textContent = T("ciao") + " " + r.cognome + " \u{1F44B}";
      } else {
        // token rifiutato (es. giocatore rimosso): via l'identita' salvata
        esci((r && r.error) || "token rifiutato");
      }
    },
    why => { if (!nomeCache) { $("nt-why").textContent = "[rete: " + why + "]"; mostra("no-token"); } });
}
function esci(motivo) {
  ["wf_id", "wf_nome", "wf_ans", "wf_last", "wf_vas"].forEach(k => localStorage.removeItem(k));
  $("nt-why").textContent = "[" + motivo + "]";
  mostra("no-token"); scrollTo(0, 0);
}
function pronto(cognome) {
  $("saluto").textContent = T("ciao") + " " + cognome + " \u{1F44B}";
  avviaPush(cognome);
  if (localStorage.getItem("wf_last") === new Date().toDateString()) mostra("fatto");
  else mostra("form");
}

/* ---- scale 1-5 con faccine ---- */
document.querySelectorAll(".card[data-k]").forEach(card => {
  const k = card.dataset.k, box = card.querySelector(".scala");
  for (let v = 1; v <= 5; v++) {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = "<span class='faccia'>" + FACCE[v - 1] + "</span>";
    b.setAttribute("aria-label", String(v));   // per i lettori di schermo
    b.onclick = () => {
      risposte[k] = v;
      box.querySelectorAll("button").forEach(x => x.classList.remove("sel"));
      b.classList.add("sel"); card.classList.add("ok-bordo");
      progresso();
    };
    box.appendChild(b);
  }
});

/* ---- orari: memoria dell'ultima compilazione + passi da 15 minuti ---- */
$("t-inizio").value = localStorage.getItem("wf_t_inizio") || "23:30";
$("t-fine").value   = localStorage.getItem("wf_t_fine")   || "08:00";
document.querySelectorAll(".ora button").forEach(b => {
  b.onclick = () => {
    const inp = $(b.dataset.o);
    if (!inp.value) inp.value = b.dataset.o === "t-inizio" ? "23:30" : "08:00";
    const [h, m] = inp.value.split(":").map(Number);
    let tot = ((h * 60 + m + Number(b.dataset.d)) % 1440 + 1440) % 1440;
    inp.value = String(Math.floor(tot / 60)).padStart(2, "0") + ":" +
                String(tot % 60).padStart(2, "0");
    durata(); progresso();
  };
});
$("t-inizio").onchange = $("t-fine").onchange = () => { durata(); progresso(); };
function durata() {
  const a = $("t-inizio").value, b = $("t-fine").value, el = $("durata");
  if (!a || !b) { el.textContent = ""; return; }
  const [h1, m1] = a.split(":").map(Number), [h2, m2] = b.split(":").map(Number);
  const min = (((h2 * 60 + m2) - (h1 * 60 + m1)) % 1440 + 1440) % 1440;
  el.textContent = "≈ " + Math.floor(min / 60) + "h " +
                   String(min % 60).padStart(2, "0") + "m " + T("sonno_txt");
  el.classList.toggle("strana", min < 180 || min > 780);
}

/* ---- VAS dolore ----------------------------------------------------------
   Si vede in due casi: interruttore acceso nel foglio per quel giocatore
   (vasOn), oppure ha appena detto di avere dolore in una zona.
   Chi risponde "No" non la vede e il valore torna vuoto.                    */
function vasVisibile() { return vasOn || dolore === "Si"; }
function mostraVas() {
  const on = vasVisibile();
  $("card-vas").style.display = on ? "block" : "none";
  if (!on) { vas = null; $("vas-r").value = 0; }
  disegnaVas(); progresso();
}
function disegnaVas() {
  const el = $("vas-val");
  if (vas === null) {
    el.innerHTML = "&mdash;<span class='tocca'>" + T("vas_tocca") + "</span>";
    el.classList.remove("dato"); $("vas-r").classList.remove("dato");
  } else {
    el.textContent = vas + " / 10";
    el.classList.add("dato"); $("vas-r").classList.add("dato");
  }
}
$("vas-r").oninput = () => { vas = Number($("vas-r").value); disegnaVas(); progresso(); };
function accendiVas(on) {
  vasOn = !!on;
  mostraVas();
}

/* ---- dolore in una zona (apre zona + scala) ---- */
$("d-no").onclick = () => { dolore = "No";
  $("d-no").classList.add("sel-no"); $("d-si").classList.remove("sel-si");
  $("zona-box").style.display = "none"; $("t-zona").value = ""; mostraVas(); };
$("d-si").onclick = () => { dolore = "Si";
  $("d-si").classList.add("sel-si"); $("d-no").classList.remove("sel-no");
  $("zona-box").style.display = "block"; mostraVas(); };
$("t-zona").oninput = () => progresso();

/* ---- staff medico ---- */
$("f-no").onclick = () => { fisio = "No";
  $("f-no").classList.add("sel-no"); $("f-si").classList.remove("sel-si");
  progresso(); };
$("f-si").onclick = () => { fisio = "Si, Yes";
  $("f-si").classList.add("sel-si"); $("f-no").classList.remove("sel-no");
  progresso(); };

/* ---- barra di progresso ------------------------------------------------
   10 di base: 6 scale + 2 orari + dolore si/no + staff medico si/no.
   Chi ha dolore ne ha 12: in piu' la zona e la scala 0-10.               */
function zonaScritta() { return $("t-zona").value.trim() !== ""; }
function progresso() {
  const tot = 10 + (dolore === "Si" ? 1 : 0) + (vasVisibile() ? 1 : 0);
  let n = Object.keys(risposte).length;
  if ($("t-inizio").value) n++;
  if ($("t-fine").value) n++;
  if (dolore) n++;
  if (fisio) n++;
  if (dolore === "Si" && zonaScritta()) n++;
  if (vasVisibile() && vas !== null) n++;
  $("conta").textContent = n + " / " + tot;
  $("pieno").style.width = (n / tot * 100) + "%";
}

/* ---- invio ---- */
function oraGoogle(hhmm) {
  if (!hhmm) return "";
  const [h, m] = hhmm.split(":");
  return parseInt(h, 10) + "." + m + ".00";
}
$("invia").onclick = () => {
  const msg = $("f-msg");
  const manca = ["sonno", "energia", "fatica", "doms", "stress", "umore"].filter(k => !risposte[k]);
  if (manca.length || !fisio || !dolore || !$("t-inizio").value || !$("t-fine").value ||
      (vasVisibile() && vas === null)) {
    msg.className = "msg err"; msg.textContent = T("err_completa"); return;
  }
  // chi dice di avere dolore deve dire anche dove: allo staff medico non
  // devono piu' arrivare segnalazioni con "zona non indicata"
  if (dolore === "Si" && !zonaScritta()) {
    msg.className = "msg err"; msg.textContent = T("err_zona");
    $("t-zona").focus(); return;
  }
  msg.className = "msg"; msg.textContent = "";
  $("invia").disabled = true; $("invia").textContent = T("inviando");

  chiama(new URLSearchParams({
      token: WEBHOOK_TOKEN, id: ID,
      sonno: risposte.sonno, inizio: oraGoogle($("t-inizio").value),
      fine: oraGoogle($("t-fine").value), stress: risposte.stress,
      fatica: risposte.fatica, doms: risposte.doms, umore: risposte.umore,
      energia: risposte.energia, fisio: fisio,
      regione: dolore === "Si" ? $("t-zona").value.trim() : "",
      vas: (vasVisibile() && vas !== null) ? vas : ""
    }),
    r => {
      $("invia").disabled = false; $("invia").textContent = T("invia");
      if (r && r.ok) {
        localStorage.setItem("wf_last", new Date().toDateString());
        localStorage.setItem("wf_t_inizio", $("t-inizio").value);
        localStorage.setItem("wf_t_fine", $("t-fine").value);
        // risposte del giorno: se riapre oggi le ritrova selezionate
        localStorage.setItem("wf_ans", JSON.stringify({
          d: new Date().toDateString(), r: risposte, f: fisio, dol: dolore,
          z: $("t-zona").value.trim(), v: vas }));
        $("fatto-ora").textContent = new Date().toLocaleString("it-IT");
        mostra("fatto"); scrollTo(0, 0);
      } else if (r && r.error && /non riconosciuto/i.test(r.error)) {
        esci(r.error);          // giocatore rimosso: identita' cancellata
      } else {
        msg.className = "msg err";
        msg.textContent = (r && r.error) ? r.error : T("err_reg");
      }
    },
    why => {
      $("invia").disabled = false; $("invia").textContent = T("invia");
      msg.className = "msg err";
      msg.textContent = (why + "").startsWith("http") ? T("err_server") : T("err_rete");
    });
};
$("rifai").onclick = () => { mostra("form"); scrollTo(0, 0); };

/* ---- OneSignal (external_id = cognome: e' cosi' che il NAS mira i ritardatari) ---- */
function avviaPush(cognome) {
  if (!ONESIGNAL_APP_ID || ONESIGNAL_APP_ID.startsWith("INCOLLA")) return;
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async OneSignal => {
    try {
      await OneSignal.init({
        appId: ONESIGNAL_APP_ID,
        serviceWorkerPath: "/wellness/OneSignalSDKWorker.js",
        serviceWorkerParam: { scope: "/wellness/" }
      });
      await OneSignal.login(cognome);
      // il permesso si chiede solo su tocco esplicito (Chrome soffoca le
      // richieste automatiche al caricamento): card "attiva le notifiche"
      if ("Notification" in window && Notification.permission === "default") {
        $("push-card").style.display = "block";
        $("push-btn").onclick = async () => {
          await OneSignal.Notifications.requestPermission();
          if (Notification.permission !== "default")
            $("push-card").style.display = "none";
        };
      }
    } catch (e) { /* push non disponibile: l'app funziona comunque */ }
  });
}

/* ---- se oggi ha gia' inviato, ripropongo le risposte selezionate ---- */
(function ripristina() {
  let a; try { a = JSON.parse(localStorage.getItem("wf_ans")); } catch (e) { return; }
  if (!a || a.d !== new Date().toDateString()) return;
  document.querySelectorAll(".card[data-k]").forEach(card => {
    const v = a.r && a.r[card.dataset.k];
    const b = v && card.querySelectorAll(".scala button")[v - 1];
    if (b) b.onclick();
  });
  // "dol" manca nelle risposte salvate prima dell'11/08/2026: in quel caso
  // la zona scritta vale come "aveva dolore"
  const avevaDolore = a.dol ? a.dol === "Si" : !!(a.z && a.z.trim());
  if (avevaDolore) { $("d-si").onclick(); $("t-zona").value = a.z || ""; }
  else $("d-no").onclick();
  if (a.f === "No") $("f-no").onclick();
  else if (a.f) $("f-si").onclick();
  if (typeof a.v === "number" && vasVisibile()) {
    $("vas-r").value = a.v; vas = a.v; disegnaVas(); progresso();
  }
})();

applicaLingua();
avvia();
</script>
</body>
